<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Number Stream UI</title>
    <style>
        /* Reset and layout baseline */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* 30% / 70% Split Screen Container */
        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Left Panel (30%) */
        .left-panel {
            width: 30%;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .left-panel h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .input-group textarea, 
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 0.95rem;
            resize: vertical;
        }

        .input-group textarea:focus, 
        .input-group input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        button#submit-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button#submit-btn:hover {
            background-color: #0369a1;
        }

        button#submit-btn:active {
            background-color: #03588c;
        }

        /* Right Panel (70%) */
        .right-panel {
            width: 70%;
            background-color: #0f172a;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .right-panel h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        /* SSE Message Stream Container */
        #message-container {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Individual Message Card styling for clean appending */
        .sse-message {
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            padding: 12px 16px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="split-container">
        <!-- Left Panel: 30% Width -->
        <div class="left-panel">
            <h2>Controls</h2>
            <div class="input-group">
                <label for="user-input">Prompt / Query</label>
                <textarea id="user-input" rows="4" placeholder="Enter input or parameters..."></textarea>
            </div>
            <button id="submit-btn">Submit</button>
        </div>

        <!-- Right Panel: 70% Width -->
        <div class="right-panel">
            <h2>Received Stream Events</h2>
            <div id="message-container">
                <div class="sse-message" style="color: #64748b; border-left-color: #475569;">
                    Awaiting SSE connection output...
                </div>
            </div>
        </div>
    </div>

    <!-- Cache-busting dynamic script injection placeholder -->
    <script>
        const script = document.createElement('script');
        script.src = `/static/app.js?v=${Date.now()}`;
        document.body.appendChild(script);
    </script>
</body>
</html>
